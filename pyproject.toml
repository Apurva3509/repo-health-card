[project]
name = "repo-health-card"
version = "0.1.0"
description = "Generate an actionable health report for a GitHub repository"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Apurva Patel" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
repo-health-card = "repo_health_card.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
required-version = ">=0.8.0"

